  - id: "01"
    title: 外面蹭蹭不进去，成年人最大的鬼话
    cover: [外面蹭蹭不进去，, 成年人最大的鬼话]
    text: |
      床头情话排行榜，榜首永远是男人那句“我就外面蹭蹭”。
      这种鬼话，纯属欺负姑娘对生理常识的巨大 ignorance (n. 无知；不了解)。
      身体分泌是不受控的 variable (n. 变量；不稳定) 液体，你以为你是精准控油的发动机？
      那一哆嗦的无套快感，根本不值你去接 unexpected (adj. 出乎意料；意外的) 的意外大招。
      等大姨妈迟到时，你面对的，是不得不去医院挂号的残忍 consequence (n. 后果；结果)。
      真正性感的床头，从来不缺准备充分的 backup (n. 后备；备用) 杜蕾斯。
      用理智拉上 barrier (n. 屏障；防御) 安全红线，才是给彼此最深情的 commitment (n. 责任；承诺)。
      别让一时的脑热，演变成带全家去医院打胎的 disaster (n. 灾难；失败) 悲剧。
