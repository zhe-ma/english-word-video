episodes:
  - id: "01"
    title: 天天劝我格局打开，其实就是不想给钱
    cover: [天天劝我格局打开，其实就是不想给钱]
    text: |
      你今天跟我谈加班费和职级对齐，说实话我非常 regretful (adj. 遗憾的/抱歉的 /rɪˈɡretfl/)。
      你现在的 priority (n. 优先考虑的事/核心 /ˈpraɪɒrəti/) 应该是把眼光放长远，不要总是计较个人利益。
      大厂最宝贵的不是你眼下多拿的这三五千，而是公司给你的伟大 platform (n. 平台/舞台 /ˈplætfɔːm/)。
      你现在正是筑基打底的时候，天天算计付出和回报，我很质疑你的 vision (n. 眼光/眼界/愿景 /ˈvɪʒn/)。
      你看看隔壁组的某某，人家周末自发来公司扎根业务，展现出极强的 loyalty (n. 忠诚/忠心 /ˈlɔɪəlti/)。
      只有当你真正把公司的目标，当成你自己的 enterprise (n. 事业/企业 /ˈentəpraɪz/) 去经营。
      打破你狭隘的个人边界，主动去为团队做出应有的 sacrifice (n./v. 牺牲/付出 /ˈsækrɪfaɪs/)。
      让你的格局彻底大开，属于你的升职加薪 prospect (n. 前景/未来的机会 /ˈprɒspekt/) 将来自然都会有。

  - id: "02"
    title: 我对你是有些失望的
    cover: [我对你是有些失望的]
    text: |
      今天找你主要是复盘一下你这半年的 underperformance (n. 表现不佳/业绩惨淡 /ˌʌndəpəˈfɔːməns/)。
      说实话，站在管理者的角度，其实我对你是有些 disappointed (adj. 失望的/沮丧的 /ˌdɪsəˈpɔɪntɪd/)。
      刚招你进来时我看重你的干劲，但现在我感觉你一直停留在 comfort zone (n. 舒适圈/舒适区 /ˈkʌmfət zəʊn/)。
      你每天加班，但有没有想过这只是用战术勤奋掩盖战略上的 laziness (n. 懒惰/怠惰 /ˈleɪzinəs/)？
      你给团队带来的增量价值到底在哪里？你的 capability (n. 能力/胜任力 /ˌkeɪpəˈbɪləti/) 真的退步了。
      我之前对你的期望是你能独当一面，去负责一整条 business line (n. 业务线/业务范围 /ˈbɪznəs laɪn/)。
      但现在看下来，你离那个高级标准还有相当大的 gap (n. 差距/间隙 /ɡæp/)。
      如果接下来的季度你还拿不出结果，公司可能不得不面临团队的 layoff (n. 裁员/解雇 /ˈleɪɒf/)。

  - id: "03"
    title: 你的产出缺乏体系化思考
    cover: [你的产出缺乏体系化思考]
    text: |
      我看了你提交的这份方案，整体感觉还是太 fragmented (adj. 零散的/碎片化的 /ˈfræɡmentɪd/)。
      你只是把上游需求做了一次堆砌，缺乏体系化的 thinking (n. 思考/见解 /ˈθɪŋkɪŋ/)。
      你告诉我，这个项目的顶层设计逻辑是什么？你的 framework (n. 架构/框架 /ˈfreɪmwɜːk/) 在哪里？
      如果只是跑通几个接口，随便找个实习生都能做，你的 irreplaceability (n. 不可替代性 /ˌɪrɪˈpleɪsəˈbɪləti/) 体现在哪？
      你要学会站在更高的维度俯瞰业务，形成一套可复用的 methodology (n. 方法论/系统方法 /ˌmeθəˈdɒlədʒi/)。
      而不是只沉迷于低头拉车，把精力和预算全部砸在形式主义的 redundancy (n. 形式主义的穷忙/多余 /rɪˈdʌndənt/) 上。
      这场评估不是为了否定你，而是为了避免你的工作陷入毫无竞争力的 vulnerability (n. 脆弱性/易受攻击性 /ˌvʌlnərəˈbɪləti/)。
      只有真正形成你个人的核心壁垒，你才能在这个内卷的系统里实现 survival (n. 生存/幸存 /səˈvaɪvl/)。

  - id: "04"
    title: 你只是在‘做事情’，没有找到业务的杠杆点
    cover: [你只是在‘做事情’，没有找到业务的杠杆点]
    text: |
      你干得很辛苦这我知道，但结果导向来看，你缺乏核心的 leverage (n. 杠杆作用/核心手段 /ˈliːvərɪdʒ/)。
      做事情是最低阶的执行，找杠杆才是高阶的 strategy (n. 策略/高阶思考 /ˈstrætədʒi/)。
      你把大部分精力消耗在只带来微小收益的边缘业务，完全抓不住核心 contradiction (n. 矛盾/核心冲突 /ˌkɒntrəˈdɪkʃn/)。
      你没有去撬动关键的转化节点，导致项目发展处于 stagnant (adj. 停滞不前的/死气沉沉的 /ˈstæɡnənt/)。
      光有苦劳没有功劳，在大厂的考核标准里就是一种 failure (n. 失败/不合格 /ˈfeɪljə(r)/)。
      下个月你必须重新梳理你的 OKRs (n. 目标与关键结果法 /əʊ keɪ ɑːz/)，砍掉那些低价值的事务。
      找到真正能撬动大盘的爆破点，实现业务指标 matrix (n. 指标矩阵/模型 /ˈmeɪtrɪks/) 的指数级 growth (n. 增长/发展 /ɡrəʊθ/)。

  - id: "05"
    title: 给你打低绩效是为了激励你
    cover: [给你打低绩效是为了激励你]
    text: |
      今年的绩效结果，经过内部的综合讨论，最后给你落了 underperformance (n. 低绩效/表现不佳 /ˌʌndəpəˈfɔːməns/)。
      我知道你心里可能会有落差，觉得这场强行背指标的考核非常 unfair (adj. 不公平的/不合理的 /ˌʌnˈfeə(r)/)。
      但我希望你能理解我的苦心，成长往往伴随着巨大的 pain (n. 痛苦/痛楚 /peɪn/)。
      如果每年都给你打平庸的正常分，你就会陷入温水煮青蛙的 inertia (n. 惯性/惰性 /ˈɪnɜːʃə/)。
      这次摔跤是一次警醒，也是你突破职业瓶颈的最好 trigger (n./v. 契机/触发器 /ˈtrɪɡə(r)/)。
      团队今年指标压力大，必须有人站出来承接高层的 pressure (n. 压力/压迫 /ˈpreʃə(r)/)。
      我把这个名额落给你，是因为我觉得你心智足够成熟，能够自我 reflect (v. 反思/沉思 /rɪˈflekt/)。
      希望你把这次打压变成逆袭的动力，明年用结果来证明你的 competency (n. 胜任力/能力 /ˈkɒmpɪtənsi/)。
