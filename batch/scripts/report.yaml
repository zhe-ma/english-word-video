  - id: "01"
    title: 数据平平无奇，周报惊天动地
    cover: [数据平平无奇，周报惊天动地]
    text: |
      大厂里有些人，最擅长在平庸的数据里“大海捞针”找亮点。
      哪怕项目数据一路 underperformance (n. 表现不佳/数据平庸 /ˌʌndəpəˈfɔːməns/) ，他们也能展现出极其惊人的 initiative (n. 主动性/积极翻找 /ɪˈnɪʃətɪv/) 疯狂翻找。
      他们能从各种刁钻的角度给数据化妆，把毫无起色的报表强行包装成 optimization (n. 优化/强行包装 /ˌɒptɪmaɪˈzeɪʃn/) 。
      日常汇报时对着老板一顿疯狂输出，大肆吹嘘自己给项目带来了巨大的 synergy (n. 协同效应/吹嘘成效 /ˈsɪnədʒi/) 。
      老板看后连连点赞，其实明眼人一看就知道全是形式主义的 redundancy (n. 形式主义的穷忙/凑数 /rɪˈdʌndənt/) 凑数。
      这种把平庸数据编成神话的 hypocrisy (n. 虚伪/糊弄套路 /ˈhɪpɒkrəsi/) 让人叹为观止，全是糊弄高层的套路。
      为了让汇报总结天天有东西写，他们会故意折腾出几件毫无意义的 task (n. 任务/折腾出来的事 /tɑːsk/) 强行邀功。
      一旦在老板面前成功拿到了 credit (n. 功劳/荣誉 /ˈkredɪt/) ，他们立刻把项目丢给底层牛马，转身去干别的事了。
