# 大厂黑话十篇。正文只留英文，词性和释义写在括号里，由脚本拆到单词下方。
defaults:
  level: 雅思
  series: 职场黑话英语
  source: 大厂黑话
  voice: zh-CN-XiaoxiaoNeural
  rate: "+5%"

episodes:
  - id: "01"
    title: 只要你足够内耗，公司就成功了
    cover: [只要你足够内耗，, 公司就成功了]
    rate: "+20%"
    review_rate: "+12%"
    gloss_rate: "+18%"
    text: |
      ownership (n. 主人翁意识)，领导对你说过这句话吗？
      大厂发 underperformance (n. 低绩效) 给你，就是拿黑话打压你。
      再声称你缺乏 initiative (n. 主动性)，质疑你的 competency (n. 能力)。
      项目黄了是高层的锅，却逼你 take the blame (短语. 背锅)。
      指标完不成，就找人当 scapegoat (n. 替罪羊)。
      大厂的 underlying logic (n. 底层逻辑) 很简单。
      你只是在 layoff (n. 裁员) 之前，成了最好捏的软柿子。

  - id: "02"
    title: 用明天的宏大愿景，买你今天的廉价命
    cover: [用明天的宏大愿景，, 买你今天的廉价命]
    text: |
      老板天天描绘伟大的 blueprint (n. 蓝图；愿景)，改用未来的想象力来白嫖当下的劳动力。
      开会必谈团队 synergy (n. 协同效应；增效)，声称只要拥抱变化，就能实现阶级 leap (n./v. 飞跃；跳跃)。
      结果一到年底，所谓的升职加薪就变成了一场完美的 illusion (n. 幻觉；错觉)。
      大厂所谓的 optimization (n. 降本增效；优化)，其 essence (n. 本质；精髓) 很简单。
      用最伟大的 vision (n. 愿景；眼界)，来 rationalize (v. 使合理化) 当下最直接的压榨。
      你以为你在和公司共创未来，其实你只是在用命 sponsor (v. 赞助；资助) 老板的下一套豪宅。

  - id: "03"
    title: 别和垃圾项目死磕，它是黑话假面舞会
    cover: [别和垃圾项目死磕，, 它是黑话假面舞会]
    text: |
      每天雷打不动的复盘会，就是一场大型的互联网黑话 masquerade (n. 化装舞会；伪装)。
      大家在工位上处于 stagnant (adj. 停滞不前) 状态，却在周报里疯狂 optimize (v. 优化；使完善) 自己的措辞。
      为了证明自己没有变成 redundant (adj. 多余的；被淘汰的) 的人工成本，必须把简单的沟通 complicate (v. 使复杂化)。
      那些高大上的 alignment (n. 对齐；达成一致)，其实没有任何实质的 substance (n. 实质；物质)。
      大厂的内卷机制就是：用最精妙的 terminology (n. 专门术语)，来 disguise (v. 伪装；掩饰) 业务上最彻底的无能。

  - id: "04"
    title: 最怕老板一拍脑门，中层跪着层层加码
    cover: [最怕老板一拍脑门，, 中层跪着层层加码]
    text: |
      老板在群里随口发出的一句闲聊，总能被高管当成不可违背的 dictate (n. 指令；命令)。
      中层领导为了展现执行力，不仅不据理力争，反而展现出极度扭曲的 compliance (n. 顺从；合规)。
      他们无脑迎合高层那些 arbitrary (adj. 专断的；随意的) 的想法，将灾难层层加码。
      所谓的对齐，不过是领导在用底层牛马的命，去 flatter (v. 奉承；讨好) 老板个人的瞬间自嗨。
      高层的每一个盲目决策，都要靠剥夺下属的休息时间来 offset (v. 抵消；补偿)。
      你以为你在做具有 dynamic (adj. 充满活力) 意义的创新，其实你只是在用你的加班，来掩盖无脑领导在老板面前的 servility (n. 奴性；谄媚)。

  - id: "05"
    title: 以用户为中心，是不穿衣服的国王
    cover: [以用户为中心，, 是不穿衣服的国王]
    text: |
      大厂里天天高喊的 user-centric (adj. 以用户为中心) 逻辑，本质只是一块粉饰太平的遮羞布。
      产品经理在调研时满口用户痛点，一到评审会立刻变成盲目 cater (v. 迎合；投合) 老板的汇报机器。
      哪怕数据证明方案完美，只要高层一个眉头，所有的心血都会遭到 veto (v./n. 否决；拒绝)。
      大厂做产品的真实逻辑其实是老板导向，改用老板的审美代替市场的真实反馈。
      这种作业的 absurdity (n. 荒谬；荒诞) 就在于：你的核心任务只是去满足老板个人偏好。
      所谓的敏捷迭代，不过是在高层那些 capricious (adj. 反复无常) 的指令里，自我感动的无意义 redundancy (n. 穷忙；多余)。

  - id: "06"
    title: 所谓的自由，是不限地点的隐形枷锁
    cover: [所谓的自由，, 是不限地点的隐形枷锁]
    text: |
      大厂引以为傲的 flexible (adj. 灵活的；有弹性的) 工作制，本质是一场 24 小时待命的隐形枷锁。
      所谓的 autonomy (n. 自主权；独立性)，不过是赋予了你在深夜随时随地掏出电脑办公的权利。
      你以为自己能够掌控节奏，结果却被无形的数据大盘彻底 enslave (v. 奴役；束缚)。
      高层冷酷的 matrix (n. 指标矩阵) 很简单：用最先进的系统，perpetuate (v. 使持续) 永无止境的劳动压榨。
      直到你耗尽所有 vitality (n. 活力；生命力)，他们才会迅速换下一个眼神清澈、充满 energy (n. 精力；能量) 的毕业生。
      这种高维度的 exploitation (n. 剥削；榨取) 让你逃无可逃。

  - id: "07"
    title: 35岁不可逆的贬值，是终身成长的代价
    cover: [35岁不可逆的贬值，, 是终身成长的代价]
    text: |
      大厂最爱鼓励员工 sustain (v. 维持；持续) 终身成长，却转头在招聘上卡死 35 岁的红线。
      你的经验，在更廉价的年轻劳动力面前，瞬间变成了巨大的 liability (n. 累赘；负债)。
      当你无法再为业务带来额外的增量，你的忠诚就会瞬间被 depreciate (v. 贬值；轻视)。
      大厂对于高龄员工的 disposal (n. 清除；处理) 安排，往往体面而残忍。
      所谓的“毕业”，不过是一场年龄 discrimination (n. 歧视)。
      他们用制度 validate (v. 使合理；证实) 压榨的合法性，最后留下你独自面对生活的 vulnerability (n. 脆弱性)。

  - id: "08"
    title: 格子间里没有朋友，只有利益的合伙人
    cover: [格子间里没有朋友，, 只有利益的合伙人]
    text: |
      大厂的格子间没有朋友，只有在特定利益下短暂 allied (adj. 结盟的) 的塑料同盟。
      平时满口 collaboration (n. 合作；协作)，一到出事立刻表演高级 evasion (n. 逃避；推卸)。
      他们总能把自己的 negligence (n. 疏忽；失职)，巧妙地 manipulate (v. 操纵；摆布) 成别人的过错。
      这种精致的 hypocrisy (n. 虚伪；伪善) 让人叹为观止。
      他们两面三刀的 tactic (n. 策略；战术) 很简单：汇报时抢走所有 credit (n. 功劳；荣誉)，出事时瞬间撇清所有责任。

  - id: "09"
    title: 新人吃肉老人吃土，倒挂的是你的尊严
    cover: [新人吃肉老人吃土，, 倒挂的是你的尊严]
    text: |
      大厂的倒挂薪资，最擅长在金钱上对老员工进行 humiliation (n. 羞辱；丢脸)。
      你辛辛苦苦为公司稳定产出，结果刚毕业的新人，起薪直接高你一截。
      面对你的质疑，领导总能用一套冠冕堂皇的 rhetoric (n. 花言巧语；修辞) 把你强行安抚。
      他们声称这是为了团队的结构升级，必须引入高薪人才打破原有的 inertia (n. 惰性；惯性)。
      在这场残酷游戏里，你熟练的经验，在他们眼里早就被严重贬值。
      老员工的卑微努力，最终成了公司倒逼你主动 quit (v. 离职；退出) 的垫脚石。
      你只能在这场不公中痛苦地 endure (v. 忍受；忍耐) 煎熬。

  - id: "10"
    title: 所有的热血团建，都是服从性测试
    cover: [所有的热血团建，, 都是服从性测试]
    text: |
      大厂最爱用高大上的愿景进行 indoctrination (n. 洗脑；灌输)，把剥削包装成福报。
      周末强行组织狼性团建，本质上就是一场高维度的 obedience (n. 服从；顺从) 测试。
      他们在台上煽情，要求你为公司奉献一切，彻底碾碎你的个体 identity (n. 身份认同；个性)。
      你稍微表现出清醒或抗拒，就会被贴上缺乏团队荣誉感的标签。
      这种有毒文化的 sophisticated (adj. 精致的；复杂的) 之处就在于。
      它用虚无的集体荣誉，去 justify (v. 证明合理) 对你私人时间的无情蚕食。
      所谓的凝聚力，不过是加速你精力和热情的 consumption (n. 消耗；消费) 过程。
